name: Quality checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6
      - name: Check JavaScript syntax
        run: node --check app.js
      - name: Check required app files
        run: test -s index.html && test -s styles.css && test -s app.js
